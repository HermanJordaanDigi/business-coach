[project]
name = "business-coach"
version = "0.1.0"
description = "Business coaching analytics project with PostgreSQL, Python, and API integration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.0,<3.0.0",
    "numpy>=1.26.0,<2.0.0",
    "faker>=22.0.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "fastapi>=0.109.0,<1.0.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0,<3.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
    "sqlalchemy>=2.0.25",
    "httpx>=0.26.0",
    "scipy>=1.16.3",
    "statsmodels>=0.14.5",
    "jupyter>=1.1.1",
    "ipykernel>=7.1.0",
    "kaleido>=1.2.0",
    "slowapi>=0.1.9",
    "streamlit>=1.30.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
]
